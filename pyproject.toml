[project]
name = "tb-amr"
version = "0.1.0"
description = "TB Antimicrobial Resistance Analysis and Decision Support System"
authors = [
    {name = "TB-AMR Project Contributors"}
]
license = {text = "MIT"}
readme = "README.md"
homepage = "https://gitlab.com/statwig-public/tb-amr"
repository = "https://gitlab.com/statwig-public/tb-amr"
keywords = ["tuberculosis", "antimicrobial-resistance", "healthcare", "clinical-decision-support"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "altair>=5.5.0",
    "fuzzywuzzy>=0.18.0",
    "joblib>=1.4.2",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "plotly>=6.0.1",
    "psycopg2-binary>=2.9.10",
    "python-levenshtein>=0.27.1",
    "requests>=2.32.3",
    "scikit-learn>=1.6.1",
    "sqlalchemy>=2.0.40",
    "streamlit>=1.44.1",
    "trafilatura>=2.0.0",
]
